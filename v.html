<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>शुभ विवाह · Video Invitation 🎬</title>
  <meta name="description" content="Tap to watch the wedding video invitation, with music.">
  <meta property="og:type" content="video.other">
  <meta property="og:site_name" content="CardAlbum">
  <meta property="og:title" content="🎬 शुभ विवाह · Video Invitation">
  <meta property="og:description" content="Tap to watch the video invitation, with music. Designed by Sankalp.">
  <meta property="og:image" content="https://cardalbum.vercel.app/img/promo/sudhanshu-yadu.jpg">
  <meta property="og:image:width" content="720">
  <meta property="og:image:height" content="1280">
  <meta name="theme-color" content="#0b0612">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amita:wght@700&family=Tiro+Devanagari+Hindi&family=Yatra+One&family=Great+Vibes&family=Playball&family=Satisfy&family=Cookie&family=Dancing+Script&family=Cinzel+Decorative:wght@700&family=Cinzel&family=Marcellus&family=Gilda+Display&family=Cormorant+Garamond:ital,wght@1,400&family=Pacifico&family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0b0612; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    .stage { position: fixed; inset: 0; display: grid; place-items: center; }
    canvas { display: block; height: 100dvh; max-width: 100vw; width: auto; aspect-ratio: 9 / 16; object-fit: contain; background: #000; }
    @media (min-aspect-ratio: 9/16) { canvas { height: 100dvh; width: auto; } }
    @media (max-aspect-ratio: 9/16) { canvas { width: 100vw; height: auto; } }
    .bar { position: fixed; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,.15); z-index: 3; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffc95c, #ff3d8b, #8b5cf6); }
    .ctl { position: fixed; top: 14px; right: 14px; z-index: 3; display: flex; gap: 8px; }
    .ctl button, .ctl a { border: 1px solid rgba(255,255,255,.3); background: rgba(10,6,18,.55); color: #fff; border-radius: 999px; padding: 8px 14px;
      font: 600 .85rem system-ui, sans-serif; text-decoration: none; cursor: pointer; backdrop-filter: none; }
    .start { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; text-align: center; padding: 24px;
      background: radial-gradient(circle at 50% 40%, rgba(80,20,60,.55), rgba(5,2,10,.92)); cursor: pointer; }
    .start h1 { font: 700 clamp(2rem, 9vw, 3.4rem) "Amita", serif; color: #ffd98a; line-height: 1.3; white-space: pre-line; }
    .start p { margin-top: 8px; color: rgba(255,255,255,.75); }
    .play { margin: 26px auto 12px; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 2.2rem; padding-left: 6px;
      background: linear-gradient(135deg, #ffc95c, #ff3d8b); box-shadow: 0 0 0 10px rgba(255,61,139,.18), 0 20px 50px rgba(255,61,139,.45); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.07); box-shadow: 0 0 0 18px rgba(255,61,139,.1), 0 20px 50px rgba(255,61,139,.45); } }
    .start small { display: block; margin-top: 22px; font-size: .8rem; color: rgba(255,255,255,.55); letter-spacing: .12em; text-transform: uppercase; }
    .wait { color: rgba(255,255,255,.7); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="stage"><canvas id="cv" aria-label="Video invitation"></canvas></div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="ctl" id="ctl" hidden>
    <button type="button" id="sound" aria-pressed="true">🔊</button>
    <a id="skip" href="index.html">CardAlbum →</a>
  </div>
  <div class="start" id="start" role="button" tabindex="0" aria-label="Play the video invitation">
    <div>
      <h1 id="title">शुभ विवाह</h1>
      <p>Video invitation · with music</p>
      <div class="play" aria-hidden="true">▶</div>
      <p class="wait" id="wait">Getting the video ready…</p>
      <small>Designed by Sankalp · CardAlbum</small>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/codec.js"></script>
  <script src="js/core.js"></script>
  <script src="js/couples.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/tunes.js"></script>
  <script src="js/promos.js"></script>
  <script>
    // A client's story video (js/promos.js, ?id=…). It plays once with its music, and in its last tenth of a
    // second opens the website. ?rec: no start screen and no redirect (used to make the MP4).
    (function () {
      const $ = s => document.querySelector(s);
      const q = new URLSearchParams(location.search), rec = q.has('rec');
      const promo = PROMOS[q.get('id')] || PROMOS[Object.keys(PROMOS)[0]];
      const site = (typeof SITE !== 'undefined' && Core.safeUrl(SITE.url)) || 'index.html';
      $('#title').textContent = promo.title.replace(' · ', '\n'); // the couple, then "शुभ विवाह" on its own line
      document.title = `${promo.title} · Video Invitation 🎬`;
      $('#skip').href = site;
      const player = new Studio.Player($('#cv'), rec ? 1 : (matchMedia('(max-width: 700px)').matches ? .5 : .75));
      player.set(promo.card, { ...Studio.defaults(promo.card), look: promo.script[0].look, script: promo.script, opening: promo.opening, ganeshaId: promo.ganeshaId }, SITE);
      let tune = null, muted = false, t0 = 0, raf = 0, done = false;
      const ready = Studio.fontsReady().then(() => { player.draw(0); $('#wait').hidden = true; });

      function frame(now) {
        const t = (now - t0) / 1000;
        player.draw(Math.min(t, player.total - .001));
        $('#bar').style.width = `${Math.min(100, t / player.total * 100)}%`;
        // 0.1 s before the end: off to the website (a recording just stops)
        if (!done && t >= player.total - .1) {
          done = true;
          if (rec) { window.promoDone = true; return; }
          location.href = site;
          return;
        }
        raf = requestAnimationFrame(frame);
      }
      function play() {
        if (t0) return;
        $('#start').hidden = true;
        $('#ctl').hidden = rec;
        if (!rec && typeof Tune !== 'undefined') {
          tune = new Tune(promo.music);
          if (tune.start()) tune.fadeOut(player.total - 2.6, 2.4); else tune = null;
        }
        t0 = performance.now();
        raf = requestAnimationFrame(frame);
      }
      window.promo = { player, promo, ready, play };
      if (rec) return;
      $('#start').addEventListener('click', () => ready.then(play));
      $('#start').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') ready.then(play); });
      $('#sound').addEventListener('click', () => {
        muted = !muted;
        if (tune) tune.master.gain.setTargetAtTime(muted ? 0 : Tune.LEVEL, tune.ctx.currentTime, .1);
        $('#sound').textContent = muted ? '🔇' : '🔊';
        $('#sound').setAttribute('aria-pressed', String(!muted));
      });
    })();
  </script>
</body>
</html>
